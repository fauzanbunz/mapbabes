<!-- CANVAS & LOGIC SCRIPT -->
    <script>
        // --- LOGIC FOR TABS ---
        function switchTab(modalContext, tabName) {
            const modalEl = document.getElementById('modal-' + (modalContext === 'hut' ? 'the_hut' : 'the_shop'));
            const buttons = modalEl.querySelectorAll('.tab-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');

            const contents = modalEl.querySelectorAll('.' + modalContext + '-content');
            contents.forEach(content => content.style.display = 'none');

            document.getElementById(modalContext + '-' + tabName).style.display = 'block';
        }

        // --- SUB-MODAL LOGIC ---
        function openSubModal(id) {
            document.getElementById('modal-' + id).style.display = 'flex';
        }
        function closeSubModal(id) {
            document.getElementById('modal-' + id).style.display = 'none';
        }

        window.onload = () => {
            const canvas = document.getElementById('interactive-canvas');
            const ctx = canvas.getContext('2d');
            const mapImage = document.getElementById('map-image');
            const tooltip = document.getElementById('pixel-tooltip');

            function resizeCanvas() {
                canvas.width = mapImage.clientWidth;
                canvas.height = mapImage.clientHeight;
            }
            setTimeout(() => { resizeCanvas(); }, 100);
            window.addEventListener('resize', resizeCanvas);

            const zones = [
                { id: 'the_shop', name: 'THE SHOP', points: [ {x: 882, y: 712}, {x: 1012, y: 802}, {x: 882, y: 892}, {x: 752, y: 802} ] },
                { id: 'babes_club', name: 'BABES CLUB', points: [ {x: 1476, y: 277}, {x: 1656, y: 407}, {x: 1476, y: 537}, {x: 1296, y: 407} ] },
                { id: 'the_cafe', name: 'THE CAFE', points: [ {x: 1154, y: 640}, {x: 1264, y: 720}, {x: 1154, y: 800}, {x: 1044, y: 720} ] },
                { id: 'guard_tower', name: 'GUARD TOWER', points: [ {x: 1041, y: 882}, {x: 1131, y: 982}, {x: 1041, y: 1082}, {x: 951, y: 982} ] },
                { id: 'the_hut', name: 'THE HUT', points: [ {x: 1607, y: 460}, {x: 1747, y: 560}, {x: 1607, y: 660}, {x: 1467, y: 560} ] }
            ];

            let hoveredZone = null;
            let currentOpenModal = null;
            let closingTimers = []; // Menyimpan ID timer untuk dibatalkan

            function isPointInPolygon(point, vs) {
                const baseWidth = 1920; 
                const baseHeight = 1369; 
                const scaleX = baseWidth / canvas.width;
                const scaleY = baseHeight / canvas.height;
                let x = point.x * scaleX, y = point.y * scaleY;
                
                let inside = false;
                for (let i = 0, j = vs.length - 1; i < vs.length; j = i++) {
                    let xi = vs[i].x, yi = vs[i].y;
                    let xj = vs[j].x, yj = vs[j].y;
                    let intersect = ((yi > y) != (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
                    if (intersect) inside = !inside;
                }
                return inside;
            }

            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }

            const overlay = document.getElementById('modal-overlay');

            function openModal(zoneId, event) {
                const modal = document.getElementById('modal-' + zoneId);
                if (modal && overlay) {
                    
                    // BUG FIX: Batalkan semua timer penutupan agar pop-up tidak tertutup otomatis
                    closingTimers.forEach(clearTimeout);
                    closingTimers = [];
                    
                    // Sembunyikan modal lain secara instan
                    const modals = document.querySelectorAll('.babes-modal');
                    modals.forEach(m => { m.style.display = 'none'; m.style.opacity = '0'; });

                    overlay.style.display = 'block';
                    setTimeout(() => { overlay.style.opacity = '1'; }, 10);
                    
                    modal.style.top = event.clientY + 'px';
                    modal.style.left = event.clientX + 'px';
                    modal.style.transform = 'translate(-50%, -50%) scale(0)';
                    modal.style.opacity = '0';
                    modal.style.display = 'flex';
                    
                    void modal.offsetWidth;
                    
                    modal.style.top = '50%';
                    modal.style.left = '50%';
                    modal.style.transform = 'translate(-50%, -50%) scale(1)';
                    modal.style.opacity = '1';

                    currentOpenModal = modal;
                    hoveredZone = null;
                    canvas.style.cursor = 'default';
                    tooltip.style.display = 'none';
                    draw(); 
                }
            }

            function closeAllModals() {
                if (overlay) {
                    overlay.style.opacity = '0';
                    // Simpan ID timer ke array
                    closingTimers.push(setTimeout(() => { overlay.style.display = 'none'; }, 300));
                    
                    const modals = document.querySelectorAll('.babes-modal');
                    modals.forEach(modal => {
                        modal.style.transform = 'translate(-50%, -50%) scale(0)';
                        modal.style.opacity = '0';
                        // Simpan ID timer ke array
                        closingTimers.push(setTimeout(() => { modal.style.display = 'none'; }, 300));
                    });
                    
                    const subModals = document.querySelectorAll('.sub-modal');
                    subModals.forEach(sub => sub.style.display = 'none');
                    
                    currentOpenModal = null;
                }
            }

            const closeButtons = document.querySelectorAll('.close-modal');
            closeButtons.forEach(button => { button.addEventListener('click', closeAllModals); });
            overlay.addEventListener('click', closeAllModals);

            canvas.addEventListener('mousemove', (e) => {
                if (currentOpenModal) return;
                const rect = canvas.getBoundingClientRect();
                const mousePos = { x: e.clientX - rect.left, y: e.clientY - rect.top };

                let found = null;
                for (const zone of zones) {
                    if (isPointInPolygon(mousePos, zone.points)) {
                        found = zone;
                        break;
                    }
                }

                if (found !== hoveredZone) {
                    hoveredZone = found;
                    canvas.style.cursor = hoveredZone ? 'pointer' : 'default';
                    draw();
                }

                if (hoveredZone) {
                    tooltip.innerText = hoveredZone.name;
                    tooltip.style.display = 'block';
                    tooltip.style.left = (e.clientX + 15) + 'px';
                    tooltip.style.top = (e.clientY + 15) + 'px';
                } else {
                    tooltip.style.display = 'none';
                }
            });

            canvas.addEventListener('click', (e) => {
                if (hoveredZone && !currentOpenModal) {
                    openModal(hoveredZone.id, e);
                }
            });

            canvas.addEventListener('mouseleave', () => {
                if (currentOpenModal) return;
                hoveredZone = null;
                canvas.style.cursor = 'default';
                tooltip.style.display = 'none';
                draw();
            });
        };
    </script>
